<!DOCTYPE html>
<html>
<head>
    <title>Feedback App</title>
</head>
<body>
    <h2>Add Feedback</h2>

    <form method="post">
        Name:<br>
        <input type="text" name="name" required><br><br>

        Feedback:<br>
        <textarea name="message" required></textarea><br><br>

        <button type="submit">Save</button>
    </form>

    <br>
    <a href="/view">View Feedback</a>
</body>
</html>
